<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Party pattern background">
  <rect width="240" height="240" fill="#ded0f5"/>
  <g fill="#7c3aed" stroke="#7c3aed">
    <!-- balloon -->
    <g transform="translate(45,55) rotate(-8)">
      <ellipse cx="0" cy="-6" rx="8" ry="10"/>
      <path d="M-3,4 L3,4 L0,8 Z"/>
      <path d="M0,8 C-2,11 2,13 0,16 C-2,19 2,20 0,22" fill="none" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- birthday cake -->
    <g transform="translate(190,60) rotate(6)">
      <rect x="-14" y="2" width="28" height="11" rx="2"/>
      <rect x="-8" y="-6" width="16" height="8" rx="2"/>
      <rect x="-1.5" y="-14" width="3" height="8"/>
      <ellipse cx="0" cy="-17" rx="2" ry="2.8"/>
      <circle cx="-8" cy="7.5" r="1"/>
      <circle cx="0" cy="7.5" r="1"/>
      <circle cx="8" cy="7.5" r="1"/>
    </g>

    <!-- champagne bottle -->
    <g transform="translate(120,140) rotate(-6)">
      <rect x="-3.5" y="-18" width="7" height="4" rx="1"/>
      <rect x="-3" y="-14" width="6" height="8"/>
      <path d="M-3,-6 L3,-6 L6,0 L6,12 Q6,15 3,15 L-3,15 Q-6,15 -6,12 L-6,0 Z"/>
      <circle cx="6" cy="-20" r="1.1"/>
      <circle cx="3" cy="-23" r="0.8"/>
    </g>

    <!-- wedding rings -->
    <g transform="translate(45,180) rotate(8)">
      <circle cx="-6" cy="0" r="8" fill="none" stroke-width="3"/>
      <circle cx="6" cy="0" r="8" fill="none" stroke-width="3"/>
      <path d="M6,-11 L8,-8 L6,-5 L4,-8 Z" stroke="none"/>
    </g>

    <!-- party popper / confetti -->
    <g transform="translate(195,195) rotate(-12)">
      <path d="M-6,10 L-4,-6 L4,-6 L6,10 Z"/>
      <ellipse cx="0" cy="-6" rx="4" ry="1.5"/>
      <circle cx="-8" cy="-14" r="1.3" stroke="none"/>
      <rect x="5" y="-21" width="2.4" height="2.4" transform="rotate(20 6.2 -19.8)" stroke="none"/>
      <circle cx="2" cy="-24" r="1" stroke="none"/>
      <rect x="-2" y="-10" width="2" height="2" transform="rotate(-15 -1 -9)" stroke="none"/>
      <circle cx="9" cy="-10" r="1.1" stroke="none"/>
      <path d="M-9,-6 Q-12,-10 -9,-14" fill="none" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- loose confetti flecks for extra texture -->
    <circle cx="100" cy="20" r="1.4" stroke="none"/>
    <circle cx="215" cy="120" r="1.2" stroke="none"/>
    <circle cx="12" cy="140" r="1.6" stroke="none"/>
    <rect x="149" y="213" width="2.2" height="2.2" transform="rotate(30 150 214)" stroke="none"/>
    <circle cx="70" cy="112" r="1.3" stroke="none"/>
    <circle cx="160" cy="10" r="1" stroke="none"/>
    <circle cx="20" cy="215" r="1.1" stroke="none"/>
  </g>
</svg>
